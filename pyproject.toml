[project]
name = "buffer-cli"
version = "0.1.0"
description = "A Python CLI for the Buffer API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.28.1",
]

[project.scripts]
buffer = "buffer_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buffer_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.22.0",
]
