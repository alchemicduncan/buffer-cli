[project]
name = "buffer-cli"
version = "0.1.0"
description = "A Python CLI for the Buffer API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.3",
    "requests>=2.33.1",
]

[project.scripts]
buffer = "buffer_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "requests-mock>=1.12.1",
]
